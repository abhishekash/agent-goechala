<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Observatory · Control Center</title>
<style>
:root{color-scheme:dark;font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;background:#09111e;color:#e5efff}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(circle at 15% -15%,#24436a 0,transparent 38%),#09111e;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 4vw;border-bottom:1px solid #253950;background:#0a1626cc;position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}header strong{letter-spacing:.11em;text-transform:uppercase;color:#bfe7ff}a{color:#93cdfd;text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1500px;margin:auto;padding:30px 4vw 70px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7cb5e9}.top{display:flex;align-items:end;justify-content:space-between;gap:15px}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em;margin:4px 0 6px}h2{font-size:18px;margin:0 0 14px}p{margin:8px 0;color:#a9bed6}.status{font-size:12px;color:#8fa9c8}.tabs{display:flex;gap:8px;border-bottom:1px solid #31445d;margin:26px 0 22px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#a6bbd3;padding:12px 16px}.tabs button[aria-selected=true]{color:#fff;border-color:#62d4ff}.badge{display:inline-block;border:1px solid #425a72;border-radius:999px;padding:3px 9px;font-size:11px;color:#a9c2da}.badge.wait{color:#ffd896;border-color:#ad712f;background:#49351f}.badge.running{color:#8ae5c1;border-color:#366d5d}.badge.error{color:#ffb1b5;border-color:#9e4855}
.grid{display:grid;grid-template-columns:minmax(290px, .9fr) minmax(360px,1.4fr);gap:16px}.panel{border:1px solid #2c4360;border-radius:14px;background:#111f32;padding:19px;min-width:0;box-shadow:0 18px 50px #03091633}.cards{display:grid;gap:9px;max-height:70vh;overflow:auto}.card{border:1px solid #304a67;border-radius:10px;background:#16283e;color:inherit;text-align:left;padding:13px;width:100%}.card:hover,.card.selected{border-color:#61bdeb;background:#1d3651}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.card .task{margin:9px 0 5px;font-size:13px;color:#ebf4ff;overflow-wrap:anywhere}.small{font-size:11px;color:#8fa9c8}.goal{white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto;color:#d3e6fa;background:#0c192a;padding:12px;border:1px solid #253a54;border-radius:8px}.timeline{display:grid;gap:7px;max-height:430px;overflow:auto}.event{border-left:2px solid #466b91;padding:6px 10px;background:#14263b;border-radius:0 6px 6px 0}.event.error{border-color:#fa808b}.event .small{display:flex;gap:8px}.event .body{white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;color:#dbe9fa}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.action{border:1px solid #537fa5;border-radius:8px;background:#22466b;color:#f0f8ff;padding:7px 11px}.action:hover{background:#2d5b86}.action:disabled{opacity:.5;cursor:default}.action.danger{background:#51303b;border-color:#99525f}.request{border:1px solid #875f36;background:#30281e;border-radius:11px;padding:15px;margin-bottom:12px}.request h3{margin:0 0 6px;font-size:15px}.request pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#1b222b;padding:9px;border-radius:7px;max-height:180px;overflow:auto}.request label{display:block;margin:12px 0 5px}.request input,.request textarea{width:100%;background:#0d1b2b;border:1px solid #45617f;border-radius:7px;color:#fff;padding:8px}.option{display:block;margin:4px 0;color:#d6e6f8}.option input{width:auto;margin-right:7px}.summary{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9eaff;border-left:3px solid #67d2ff;padding:8px 12px;background:#152a40}.empty{padding:24px;color:#9fb4ca}.flash{animation:flash 1.25s ease-in-out infinite}@keyframes flash{50%{box-shadow:0 0 0 4px #e5aa4744,0 0 25px #e5aa4755}}@media(prefers-reduced-motion:reduce){.flash{animation:none;border:2px solid #ffcd7d}}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{max-height:360px}}:focus-visible{outline:2px solid #8bddff;outline-offset:2px}
</style></head><body>
<header><strong>◉ Agent Observatory</strong><nav><a href="/">Trace dashboard</a></nav></header>
<main><div class="top"><div><div class="eyebrow">Live mission control</div><h1>Control Center</h1><p>One view for Codex, Claude Code, and OpenCode sessions.</p></div><span id="connection" class="status">Connecting…</span></div>
<div class="tabs" role="tablist"><button id="fleet-tab" role="tab" aria-selected="true">All agents</button><button id="attention-tab" role="tab" aria-selected="false">Needs input <span id="attention-count">0</span></button></div>
<section id="fleet" class="grid"><div class="panel"><h2>Agent sessions</h2><div id="cards" class="cards"></div></div><div class="panel" id="detail"><div class="empty">Select an agent to see its goal, prompts, errors, and progress.</div></div></section>
<section id="attention" class="panel" hidden><h2>Waiting for you</h2><div id="requests"></div></section></main>
<script>
let token=sessionStorage.getItem('observatoryToken')||'',snapshot={sessions:[],attention:[]},selected='',tab='fleet',detail=null,detailStamp=0,requestSignature='',summaryCache=new Map(),summaryAttempts=new Map(),busy=false;
const $=id=>document.getElementById(id),el=(tag,cls,value)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node};
async function api(path,body){const send=()=>fetch(path,{method:body===undefined?'GET':'POST',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});let response=await send();if(response.status===401){token=prompt('Observatory access token')||'';sessionStorage.setItem('observatoryToken',token);response=await send()}const data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);return data}
const stamp=ns=>ns?new Date(Number(ns)/1e6).toLocaleString():'No timestamp';
function switchTab(name){tab=name;for(const key of ['fleet','attention']){$(key).hidden=key!==name;$(key+'-tab').setAttribute('aria-selected',String(key===name))}if(name==='attention')renderRequests(true)}
function keyOf(session){return session.runtime+':'+session.session_id}
function sessionFor(id){return snapshot.sessions.find(session=>keyOf(session)===id)}
function renderCards(){const host=$('cards');host.replaceChildren();const sessions=snapshot.sessions.slice().sort((a,b)=>(b.attention?.length||0)-(a.attention?.length||0)||Number(b.updated_ns||0)-Number(a.updated_ns||0));if(!sessions.length){host.append(el('div','empty','No sessions observed. Start Codex or Claude Code locally, or connect OpenCode.'));return}for(const session of sessions){const pending=(session.attention||[]).length||session.state==='waiting';const card=el('button','card'+(keyOf(session)===selected?' selected':'')+(pending?' flash':''));card.type='button';const head=el('div','card-head');head.append(el('strong','',session.runtime),el('span','badge '+(pending?'wait':session.state==='running'?'running':''),pending?'Needs input':session.state||'unknown'));card.append(head,el('div','task',session.task||session.goal||session.project||'Session'));card.append(el('div','small',session.project||session.session_id));card.append(el('div','small','Updated '+stamp(session.updated_ns)));if(session.waiting_for)card.append(el('div','small',session.waiting_for));card.onclick=()=>{selected=keyOf(session);detail=null;renderCards();loadDetail()};host.append(card)}}
async function loadDetail(){const session=sessionFor(selected);const host=$('detail');if(!session){host.replaceChildren(el('div','empty','Select an agent.'));return}host.replaceChildren(el('div','empty','Loading session…'));try{const current=selected;const data=await api('/api/control/session?'+new URLSearchParams({runtime:session.runtime,id:session.session_id}));if(current!==selected)return;detail=data;detailStamp=session.updated_ns||0;renderDetail()}catch(error){host.replaceChildren(el('div','empty',error.message))}}
function renderDetail(){const session=sessionFor(selected),host=$('detail');if(!session||!detail)return;host.replaceChildren();const title=el('div','row');title.append(el('h2','',session.runtime+' · '+(session.project||session.session_id)),el('span','badge',session.state||'unknown'));host.append(title,el('div','small','Session '+session.session_id+' · '+stamp(session.updated_ns)));
host.append(el('h3','','Goal from first observed prompt'),el('div','goal',session.goal||detail.goal||'Goal text not captured'));
const actions=el('div','row');actions.style.margin='15px 0';const generate=el('button','action','Summarize progress');generate.type='button';const brief=el('div','summary',summaryCache.get(selected)?.text||(snapshot.summary_enabled?'Preparing an AI progress brief…':'Configure an AI summary provider to see done, current, and remaining work.'));generate.onclick=async()=>{const cacheKey=selected;summaryAttempts.set(cacheKey,Date.now());generate.disabled=true;brief.textContent='Summarizing recorded work…';try{const response=await api('/api/control/summary',{runtime:session.runtime,session_id:session.session_id});summaryCache.set(cacheKey,{text:response.summary,updated_ns:response.updated_ns});brief.textContent=response.summary}catch(error){brief.textContent='Summary unavailable: '+error.message}finally{generate.disabled=false}};actions.append(generate);host.append(actions,brief);
host.append(el('h3','','Prompt and activity timeline'));const timeline=el('div','timeline');const events=detail.events||[];if(!events.length)timeline.append(el('div','empty','No captured activity yet.'));for(const event of events){const item=el('div','event'+(event.result==='error'?' error':''));item.append(el('div','small',event.domain+' · '+event.action+' · '+stamp(event.time_unix_nano)));item.append(el('div','body',event.detail||event.subject||''));timeline.append(item)}host.append(timeline);
if(session.waiting_for&&!session.can_reply)host.append(el('p','small','This native session is observed from local logs. Reply in its agent window; no live control channel is attached.'));const cached=summaryCache.get(selected);if(cached&&cached.updated_ns!==session.updated_ns)brief.append(el('div','small','Earlier snapshot; refresh the summary for new activity.'));if(snapshot.summary_enabled&&(!cached||cached.updated_ns!==session.updated_ns)&&Date.now()-(summaryAttempts.get(selected)||0)>60000)queueMicrotask(()=>generate.click())}
function requestCard(request){const card=el('article','request');const session=snapshot.sessions.find(item=>item.runtime===request.runtime&&item.session_id===request.session_id);card.append(el('h3','',request.runtime+' · '+(session?.project||request.session_id)));card.append(el('div','small',request.kind+' request · '+request.id));const detail=request.detail||{};if(request.kind==='permission'){card.append(el('p','',detail.permission||'Permission requested'));card.append(el('pre','',JSON.stringify({patterns:detail.patterns,metadata:detail.metadata},null,2)));const row=el('div','row');for(const [value,label,cls] of (request.runtime==='Codex'?[['accept','Approve once','action'],['decline','Deny','action danger']]:request.runtime==='Claude Code'?[['once','Approve once','action'],['reject','Deny','action danger']]:[['once','Approve once','action'],['always','Always allow','action'],['reject','Deny','action danger']])){const button=el('button',cls,label);button.type='button';button.onclick=()=>reply(request,{decision:value},card);row.append(button)}card.append(row)}else{const questions=detail.questions||[];const form=el('form','');const inputs=[];for(const [index,question] of questions.entries()){const group=el('div','');group.append(el('label','',question.question||'Question '+(index+1)));const options=question.options||[];const selected=[];for(const option of options){const label=el('label','option');const input=el('input');input.type=(question.multiple||question.multiSelect)?'checkbox':'radio';input.name='question-'+index;input.value=option.label||'';input.onchange=()=>{if(input.type==='radio')selected.splice(0,selected.length,input.value);else{const at=selected.indexOf(input.value);if(input.checked&&at<0)selected.push(input.value);if(!input.checked&&at>=0)selected.splice(at,1)}};label.append(input,document.createTextNode((option.label||'')+(option.description?' — '+option.description:'')));group.append(label)}const custom=el('input','');custom.placeholder='Type an answer'+(options.length?' or choose above':'');if(question.isSecret)custom.type='password';group.append(custom);inputs.push({selected,custom});form.append(group)}const button=el('button','action','Send answer');button.type='submit';form.onsubmit=event=>{event.preventDefault();const answers=inputs.map(item=>item.custom.value.trim()?[item.custom.value.trim()]:item.selected);reply(request,{answers},card)};form.append(button);card.append(form)}return card}
async function reply(request,payload,card){const buttons=card.querySelectorAll('button');buttons.forEach(button=>button.disabled=true);const feedback=el('div','small','Sending response…');card.append(feedback);try{await api('/api/control/reply',{runtime:request.runtime,session_id:request.session_id,kind:request.kind,request_id:request.id,...payload});feedback.textContent='Response sent';await refresh()}catch(error){feedback.textContent=error.message;buttons.forEach(button=>button.disabled=false)}}
function renderRequests(force=false){const host=$('requests');const pending=snapshot.attention||[];const signature=JSON.stringify([pending.map(item=>item.id),snapshot.sessions.filter(item=>item.runtime!=='OpenCode'&&item.state==='waiting'&&!item.can_reply).map(item=>item.session_id)]);if(!force&&signature===requestSignature)return;requestSignature=signature;host.replaceChildren();if(!pending.length)host.append(el('div','empty','No connected agent is asking for input.'));for(const request of pending)host.append(requestCard(request));const observed=snapshot.sessions.filter(session=>session.runtime!=='OpenCode'&&session.state==='waiting'&&!session.can_reply);for(const session of observed){const card=el('article','request');card.append(el('h3','',session.runtime+' · '+(session.project||session.session_id)),el('p','',session.waiting_for||'Waiting for input'),el('div','small','Observed from local logs. Reply in the agent window until this runtime is connected through a control adapter.'));host.append(card)}}
async function refresh(){if(busy||document.hidden)return;busy=true;try{snapshot=await api('/api/control');$('connection').textContent=snapshot.opencode_error?('OpenCode: '+snapshot.opencode_error):'Live · updates every 2 seconds';const attentionCount=(snapshot.attention?.length||0)+snapshot.sessions.filter(s=>s.runtime!=='OpenCode'&&s.state==='waiting'&&!s.can_reply).length;$('attention-count').textContent=attentionCount;$('attention-tab').classList.toggle('flash',attentionCount>0);renderCards();if(tab==='attention')renderRequests();if(selected&&!sessionFor(selected)){selected='';detail=null;$('detail').replaceChildren(el('div','empty','Selected session is no longer available.'))}else if(selected&&detail&&sessionFor(selected).updated_ns!==detailStamp)loadDetail()}catch(error){$('connection').textContent='Connection error: '+error.message}finally{busy=false}}
$('fleet-tab').onclick=()=>switchTab('fleet');$('attention-tab').onclick=()=>switchTab('attention');if(new URLSearchParams(location.search).get('tab')==='attention')switchTab('attention');refresh();setInterval(refresh,2000);
</script></body></html>
